project:
  name: "replace-with-scene-name"
  domain: "banking"
  scene_type: "daily_batch"
  target_engine: "argodb"
  delivery_pattern: "cluster_load"

input_level:
  level: 1
  evidence:
    - "ddl"

scale:
  customer_rows: 1000000
  account_rows: 3000000
  txn_rows: 50000000
  history_days: 365
  daily_increment_rows: 1000000

generation:
  strategy: "hybrid"
  sdv_enabled: false
  synthesizer: "GaussianCopulaSynthesizer"
  random_seed: 42
  batch_size: 500000

tables:
  - name: "customer"
    primary_key: "customer_id"
    partition_by: []
    bucket_by: []
  - name: "account"
    primary_key: "account_id"
    foreign_keys:
      - "customer_id -> customer.customer_id"
    partition_by: []
    bucket_by: ["customer_id"]
  - name: "txn"
    primary_key: "txn_id"
    foreign_keys:
      - "account_id -> account.account_id"
    partition_by: ["biz_date"]
    bucket_by: ["account_id"]

rules:
  hard:
    - "account.open_date <= txn.txn_time"
    - "txn.amount > 0"
  soft:
    - "channel distribution should resemble production"
    - "hot partitions may exist on recent biz_date"

delivery:
  outputs:
    - "ddl"
    - "generator_sql"
    - "load_plan"
    - "verification_sql"
  target_database: "replace_with_db"
  target_path: "/tmp/replace_with_path"

verification:
  checks:
    - "pk_uniqueness"
    - "fk_validity"
    - "row_count"
    - "partition_distribution"
    - "business_rule_spot_check"